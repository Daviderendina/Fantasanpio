<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#07111f">
    <title>Albo · FantaSanpio</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="app-header">
        <a class="back" href="index.html" aria-label="Torna alla home">‹</a>
        <h1>Albo</h1><span></span>
    </header>
    
    <main class="page shell">
        <section class="page-intro compact">
            <h2>La storia della lega.</h2>
        </section>
        <section>
            <div class="section-heading">
                <div>
                    <p class="eyebrow" id="last-season-title">ULTIMA STAGIONE</p>
                </div>
            </div>
            <div id="champion-podium" class="podium"></div>
        </section>
        <section class="section-gap">
            
            <div id="cup-podium" class="cup-card"></div>
        </section>
        <section class="section-gap">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">PALMARÈS</p>
                    <h3>Albo completo</h3>
                </div>
            </div>
            <div id="honor-roll" class="honor-roll"></div>
        </section>
        <section class="section-gap">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">STAGIONI</p>
                    <h3>Storico</h3>
                </div>
            </div>
            <div id="history" class="history"></div>
        </section>
        <section class="section-gap">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">PARTECIPAZIONI</p>
                    <h3>Presenza nelle stagioni</h3>
                </div>
            </div>
            <div class="chart-wrap">
                <div id="participation" class="participation"></div>
            </div>
        </section>
    </main>
    <script src="js/albo.js"></script>
</body>

</html>
